# SPDX-License-Identifier: EUPL-1.2
# Projet Xcode décrit en texte (XcodeGen) : `xcodegen generate` produit Jalonio.xcodeproj,
# qui n'est pas versionné. Une seule application universelle : iPhone et iPad.
name: Jalonio
options:
  bundleIdPrefix: fr.jalonio
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
packages:
  JalonioKit:
    path: JalonioKit
targets:
  Jalonio:
    type: application
    platform: iOS
    sources:
      - path: Jalonio/Sources
      - path: Jalonio/Resources
      - path: Jalonio/Demo
    dependencies:
      - package: JalonioKit
    info:
      path: Jalonio/Info.plist
      properties:
        CFBundleDisplayName: Jalonio
        CFBundleDevelopmentRegion: en
        # Six langues de Jalonio (ADR-0028 du dépôt jalonio) : choix par application dans les Réglages
        CFBundleLocalizations: [en, fr, de, es, it, pt]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # HTTPS partout ; le clair n'est permis que vers un serveur local (développement)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jalonio.app
        PRODUCT_NAME: Jalonio
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
      configs:
        # Le faux serveur des tests d'interface ne part jamais dans la version publiée
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "demo-*.json DemoTransport.swift"
  JalonioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JalonioUITests
    dependencies:
      - target: Jalonio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jalonio.app.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
schemes:
  Jalonio:
    build:
      targets:
        Jalonio: all
        JalonioUITests: [test]
    test:
      targets:
        - JalonioUITests
      gatherCoverageData: true
# Tests du cœur (JalonioKit) : `swift test` dans JalonioKit/, sans simulateur.
